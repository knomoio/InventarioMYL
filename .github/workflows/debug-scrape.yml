name: Diagnóstico del scraper

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Descargar app del amigo
        working-directory: scraper
        run: node debug.js
      - name: Commit temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _friend
          git commit -m "tmp: archivos del amigo para estudio" || echo "sin cambios"
          for i in 1 2 3; do
            git push origin ${{ github.ref_name }} && break
            git pull --rebase -X ours origin ${{ github.ref_name }} || git rebase --abort
          done
